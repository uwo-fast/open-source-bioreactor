# The STLs, built where anyone can download them.
#
# `just export-parts <build>` renders every printed part of a build CGAL, so it is also the only
# check of the parts that actually print - `just test` skips head.scad and frame.scad, whose
# previews are not what prints. Minutes a build even with the parts rendering in parallel, so it
# runs on demand and on a tag rather than on every push, one job per build.
#
# Any set in scad/bioreactor.json resolves (`just check-builds`); the defaults are the two 10 L
# builds, and a run can name any other.
#
# OpenSCAD is the snapshot check.yml pins, so the parts export with the same renderer the
# checks used.

name: Export

on:
  workflow_dispatch:
    inputs:
      builds:
        description: "Parameter sets in scad/bioreactor.json to export, space separated"
        default: "jar_10L_220x305 jar_10L_magnetic"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  builds:
    name: builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      # A tag has no input, so it takes the dispatch default. jq turns the list into the JSON a
      # matrix wants.
      - id: list
        env:
          BUILDS: ${{ github.event.inputs.builds || 'jar_10L_220x305 jar_10L_magnetic' }}
        run: |
          echo "matrix=$(printf '%s\n' $BUILDS | jq -Rcn '[inputs]')" >> "$GITHUB_OUTPUT"

  export:
    name: export ${{ matrix.build }}
    needs: builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.builds.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4

      - name: Install OpenSCAD
        env:
          OPENSCAD_SNAPSHOT: "2026.10.15"
          OPENSCAD_SHA256: "9d26e390d3a5c94f2e304d94d7b2eff77fb11fcd25829f2814de147ba92ac363"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libopengl0 libglx0 libgbm1 libwayland-client0 libx11-xcb1 fonts-liberation fontconfig
          # The port lettering names this face; a missing one falls back without a warning.
          test "$(fc-match -f '%{family[0]}' 'Liberation Sans')" = "Liberation Sans"
          dir="$RUNNER_TEMP/openscad"
          file="OpenSCAD-$OPENSCAD_SNAPSHOT-x86_64.AppImage"
          mkdir -p "$dir/bin"
          curl -fsSL -o "$dir/$file" "https://files.openscad.org/snapshots/$file"
          echo "$OPENSCAD_SHA256  $dir/$file" | sha256sum -c -
          chmod +x "$dir/$file"
          (cd "$dir" && "./$file" --appimage-extract > /dev/null)
          printf '#!/bin/sh\nexec "%s/squashfs-root/AppRun" "$@"\n' "$dir" > "$dir/bin/openscad"
          chmod +x "$dir/bin/openscad"
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin/openscad" --version

      - name: Setup
        run: just setup

      # Fails on a part that does not build, is not a 2-manifold, or fits no registered printer.
      - name: Export
        run: just export-parts "${{ matrix.build }}" output | tee export.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.build }}"
            echo '```'
            grep -E '^(ok|FAIL|note) ' export.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stl-${{ matrix.build }}
          path: output/${{ matrix.build }}
          if-no-files-found: error
